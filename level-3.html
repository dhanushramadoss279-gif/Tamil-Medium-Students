*{

    padding:0;
    box-sizing:border-box;
}

body{
    font-family:'Poppins','Noto Sans Tamil',sans-serif;
    background:#f4f8ff;
    min-height:100vh;
    color:#172554;
}

.container{
    width:100%;
    max-width:700px;
    margin:auto;
    padding:18px;
}

/* HEADER */

.header{
    background:linear-gradient(135deg,#2563eb,#4f46e5);
    color:white;
    padding:20px;
    border-radius:20px;
    margin-bottom:18px;
    box-shadow:0 8px 25px rgba(37,99,235,.20);
}

.logo{
    font-size:20px;
    font-weight:700;
}

.subtitle{
    font-size:12px;
    opacity:.9;
    margin-top:3px;
}

/* LEVEL */

.level-row{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:8px;
}

.level{
    font-size:18px;
    font-weight:700;
}

.count{
    font-size:13px;
    color:#64748b;
}

.progress{
    width:100%;
    height:9px;
    background:#dbeafe;
    border-radius:20px;
    overflow:hidden;
    margin-bottom:22px;
}

.progress-bar{
    height:100%;
    width:0%;
    background:linear-gradient(90deg,#2563eb,#4f46e5);
    border-radius:20px;
    transition:.3s;
}

/* CARD */

.card{
    background:white;
    border-radius:22px;
    padding:24px 18px;
    box-shadow:0 8px 30px rgba(15,23,42,.08);
}

/* TYPE */

.type-badge{
    display:inline-block;
    background:#eff6ff;
    color:#2563eb;
    border:1px solid #bfdbfe;
    padding:7px 12px;
    border-radius:20px;
    font-size:12px;
    font-weight:600;
    margin-bottom:16px;
}

/* TAMIL */

.tamil{
    font-family:'Noto Sans Tamil',sans-serif;
    font-size:21px;
    font-weight:600;
    text-align:center;
    line-height:1.6;
    margin-bottom:20px;
}

/* ANSWER */

.answer-box{
    min-height:58px;
    border:2px dashed #bfdbfe;
    border-radius:15px;
    padding:10px;
    display:flex;
    flex-wrap:wrap;
    gap:8px;
    align-items:center;
    margin-bottom:18px;
    background:#f8fbff;
}

.answer-placeholder{
    width:100%;
    text-align:center;
    color:#94a3b8;
    font-size:13px;
}

/* WORDS */

.words{
    display:flex;
    flex-wrap:wrap;
    justify-content:center;
    gap:10px;
    margin-bottom:20px;
}

.word-btn{
    border:none;
    background:#eff6ff;
    color:#1d4ed8;
    border:1px solid #bfdbfe;
    padding:11px 15px;
    border-radius:12px;
    font-family:'Poppins',sans-serif;
    font-size:14px;
    font-weight:600;
    cursor:pointer;
    transition:.15s;
}

.word-btn:hover{
    background:#dbeafe;
}

.word-btn:active{
    transform:scale(.95);
}

.answer-word{
    border:none;
    background:#2563eb;
    color:white;
    padding:10px 13px;
    border-radius:10px;
    font-family:'Poppins',sans-serif;
    font-size:14px;
    font-weight:600;
    cursor:pointer;
}

/* BUTTONS */

.check-btn,
.next-btn{
    width:100%;
    border:none;
    border-radius:13px;
    padding:14px;
    font-family:'Poppins',sans-serif;
    font-size:15px;
    font-weight:700;
    cursor:pointer;
}

.check-btn{
    background:#2563eb;
    color:white;
}

.check-btn:hover{
    background:#1d4ed8;
}

.next-btn{
    background:#16a34a;
    color:white;
    margin-top:10px;
    display:none;
}

.result{
    text-align:center;
    font-size:14px;
    font-weight:600;
    min-height:25px;
    margin-top:14px;
}

/* COMPLETE */

.complete{
    display:none;
    text-align:center;
    padding:30px 10px;
}

.complete-icon{
    font-size:60px;
    margin-bottom:15px;
}

.complete h2{
    color:#2563eb;
    margin-bottom:8px;
}

.complete p{
    color:#64748b;
    margin-bottom:20px;
}

.level4-btn{
    display:inline-block;
    text-decoration:none;
    background:#2563eb;
    color:white;
    padding:13px 22px;
    border-radius:13px;
    font-weight:700;
}

/* MOBILE */

@media(max-width:500px){

    .container{

    }

    .tamil{

    .word-btn{

    }

}

</style>

/* =====================================================
   CREATE QUESTIONS
   ===================================================== */

let questions=[];

baseQuestions.forEach(item=>{

    questions.push({
        tamil:item.pos[0],
        english:item.pos[1],
        type:"Positive"
    });

    questions.push({
        tamil:item.neg[0],
        english:item.neg[1],
        type:"Negative"
    });

    questions.push({
        tamil:item.q[0],
        english:item.q[1],
        type:"Positive Question"
    });

    questions.push({
        tamil:item.nq[0],
        english:item.nq[1],
        type:"Negative Question"
    });

});


/* =====================================================
   SHUFFLE
   ===================================================== */

function shuffle(array){

    for(let i=array.length-1;i>0;i--){

        const j=
        Math.floor(Math.random()*(i+1));

        [array[i],array[j]]=
        [array[j],array[i]];

    }

    return array;
}


/* =====================================================
   EXACTLY 150 QUESTIONS
   ===================================================== */

questions=
shuffle(questions).slice(0,150);


/* =====================================================
   VARIABLES
   ===================================================== */

let currentIndex=0;

let selectedWords=[];

let wrongAttempts=0;

let questionLocked=false;


/* =====================================================
   ELEMENTS
   ===================================================== */

const tamilSentence=
document.getElementById("tamilSentence");

const typeBadge=
document.getElementById("typeBadge");

const wordButtons=
document.getElementById("wordButtons");

const answerBox=
document.getElementById("answerBox");

const checkBtn=
document.getElementById("checkBtn");

const nextBtn=
document.getElementById("nextBtn");

const result=
document.getElementById("result");

const currentCount=
document.getElementById("currentCount");

const progressBar=
document.getElementById("progressBar");

const gameCard=
document.getElementById("gameCard");

const completeCard=
document.getElementById("completeCard");


/* =====================================================
   SUCCESS SOUND
   ===================================================== */

function successSound(){

    const AudioContext=
    window.AudioContext ||
    window.webkitAudioContext;

    if(!AudioContext) return;

    const audio=
    new AudioContext();

    const oscillator=
    audio.createOscillator();

    const gain=
    audio.createGain();

    oscillator.frequency.value=700;

    gain.gain.setValueAtTime(
        0.12,
        audio.currentTime
    );

    gain.gain.exponentialRampToValueAtTime(
        0.001,
        audio.currentTime+0.3
    );

    oscillator.connect(gain);

    gain.connect(audio.destination);

    oscillator.start();

    oscillator.stop(
        audio.currentTime+0.3
    );

}


/* =====================================================
   WRONG SOUND
   ===================================================== */

function wrongSound(){

    const AudioContext=
    window.AudioContext ||
    window.webkitAudioContext;

    if(!AudioContext) return;

    const audio=
    new AudioContext();

    const oscillator=
    audio.createOscillator();

    const gain=
    audio.createGain();

    oscillator.type="square";

    oscillator.frequency.value=180;

    gain.gain.setValueAtTime(
        0.15,
        audio.currentTime
    );

    gain.gain.exponentialRampToValueAtTime(
        0.001,
        audio.currentTime+0.2
    );

    oscillator.connect(gain);

    gain.connect(audio.destination);

    oscillator.start();

    oscillator.stop(
        audio.currentTime+0.2
    );

}


/* =====================================================
   LOAD QUESTION
   ===================================================== */

function loadQuestion(){

    if(currentIndex>=questions.length){

        finishLevel();

        return;
    }

    const q=
    questions[currentIndex];

    tamilSentence.textContent=
    q.tamil;

    typeBadge.textContent=
    q.type;

    currentCount.textContent=
    currentIndex+1;

    progressBar.style.width=
    ((currentIndex/questions.length)*100)+"%";

    selectedWords=[];

    wrongAttempts=0;

    questionLocked=false;

    result.textContent="";

    checkBtn.style.display="block";

    checkBtn.disabled=false;

    nextBtn.style.display="none";

    renderAnswer();

    renderWords(q.english);

}


/* =====================================================
   CREATE WORD BUTTONS
   ===================================================== */

function renderWords(sentence){

    wordButtons.innerHTML="";

    const words=
    sentence.trim().split(/\s+/);

    const shuffledWords=
    shuffle([...words]);

    shuffledWords.forEach((word,index)=>{

        const button=
        document.createElement("button");

        button.className="word-btn";

        button.textContent=word;

        button.dataset.id=index;

        button.addEventListener(
            "click",
            function(){

                if(questionLocked) return;

                selectedWords.push({
                    word:word,
                    id:index
                });

                button.style.display="none";

                renderAnswer();

            }
        );

        wordButtons.appendChild(button);

    });

}


/* =====================================================
   ANSWER BOX
   ===================================================== */

function renderAnswer(){

    answerBox.innerHTML="";

    if(selectedWords.length===0){

        const placeholder=
        document.createElement("div");

        placeholder.className=
        "answer-placeholder";

        placeholder.textContent=
        "கீழே உள்ள words-ஐ click செய்து sentence உருவாக்குங்கள்";

        answerBox.appendChild(placeholder);

        return;
    }


    selectedWords.forEach((item,index)=>{

        const button=
        document.createElement("button");

        button.className="answer-word";

        button.textContent=item.word;

        button.addEventListener(
            "click",
            function(){

                if(questionLocked) return;

                selectedWords.splice(index,1);

                restoreWord(item.id);

                renderAnswer();

            }
        );

        answerBox.appendChild(button);

    });

}


/* =====================================================
   RESTORE WORD
   ===================================================== */

function restoreWord(id){

    const buttons=
    wordButtons.querySelectorAll(".word-btn");

    buttons.forEach(button=>{

        if(Number(button.dataset.id)===id){

            button.style.display=
            "inline-block";

        }

    });

}


/* =====================================================
   CHECK ANSWER
   ===================================================== */

checkBtn.addEventListener(
"click",
function(){

    if(questionLocked) return;


    const q=
    questions[currentIndex];


    if(selectedWords.length===0){

        result.textContent=
        "⚠️ முதலில் words-ஐ select செய்யுங்கள்.";

        result.style.color="#dc2626";

        return;
    }


    const userAnswer=
    selectedWords
    .map(item=>item.word)
    .join(" ");


    const correctAnswer=
    q.english;


    if(userAnswer===correctAnswer){

        questionLocked=true;

        result.textContent=
        "✅ Correct!";

        result.style.color="#16a34a";

        successSound();

        checkBtn.style.display="none";

        nextBtn.style.display="block";

        return;

    }


    /* WRONG */

    wrongAttempts++;

    wrongSound();


    if(wrongAttempts===1){

        result.textContent=
        "❌ Wrong! Try Again.";

        result.style.color="#dc2626";


        selectedWords=[];

        renderAnswer();


        const buttons=
        wordButtons.querySelectorAll(".word-btn");

        buttons.forEach(button=>{

            button.style.display=
            "inline-block";

        });

    }

    else{

        questionLocked=true;

        result.innerHTML=
        "❌ Wrong Again!<br>" +
        "Correct Answer: <strong>" +
        correctAnswer +
        "</strong>";

        result.style.color="#dc2626";

        checkBtn.style.display="none";

        nextBtn.style.display="block";

    }

});


/* =====================================================
   NEXT QUESTION
   ===================================================== */

nextBtn.addEventListener(
"click",
function(){

    if(!questionLocked) return;

    currentIndex++;

    if(currentIndex>=questions.length){

        finishLevel();

        return;
    }

    loadQuestion();

    window.scrollTo({
        top:0,
        behavior:"smooth"
    });

});


/* =====================================================
   FINISH LEVEL
   ===================================================== */

function finishLevel(){

    progressBar.style.width="100%";

    currentCount.textContent="150";

    gameCard.style.display="none";

    completeCard.style.display="block";

}


/* =====================================================
   START GAME
   ===================================================== */

loadQuestion();

</script>
