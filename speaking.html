<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>TMS Academy - AI Conversation</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:Arial,sans-serif;
    background:#eef7ff;
    height:100vh;
    display:flex;
    flex-direction:column;
}

/* CHAT */

.chat-container{
    flex:1;
    overflow-y:auto;
    padding:30px 15%;
}

.welcome{
    text-align:center;
    margin-top:18vh;
}

.welcome h1{
    color:#2563eb;
    font-size:30px;
    margin-bottom:10px;
}

.welcome p{
    color:#64748b;
    font-size:15px;
}


/* MESSAGE */

.message{
    display:flex;
    margin-bottom:20px;
}

.user{
    justify-content:flex-end;
}

.ai{
    justify-content:flex-start;
}

.bubble{
    max-width:70%;
    padding:13px 17px;
    border-radius:18px;
    font-size:15px;
    line-height:1.6;
    white-space:pre-wrap;
}


/* USER */

.user .bubble{
    background:#2563eb;
    color:white;
    border-bottom-right-radius:5px;
}


/* AI */

.ai .bubble{
    background:white;
    color:#1e293b;
    border:1px solid #dbeafe;
    border-bottom-left-radius:5px;
}


/* START CONVERSATION AREA */

.input-area{
    padding:15px 15% 20px;

    display:flex;
    justify-content:center;
}


/* START BUTTON */

.start-conversation-btn{

    border:none;

    background:#2563eb;

    color:white;

    padding:14px 28px;

    border-radius:28px;

    font-size:16px;

    font-weight:600;

    cursor:pointer;

    box-shadow:
        0 5px 15px rgba(37,99,235,0.20);

    transition:all 0.2s ease;
}

.start-conversation-btn:hover{

    background:#1d4ed8;

    transform:translateY(-2px);

    box-shadow:
        0 8px 20px rgba(37,99,235,0.25);
}

.start-conversation-btn:active{

    transform:scale(0.97);
}


/* MOBILE */

@media(max-width:700px){

    .chat-container{
        padding:20px 12px;
    }

    .input-area{
        padding:10px 10px 15px;
    }

    .welcome h1{
        font-size:25px;
    }

    .start-conversation-btn{
        padding:13px 24px;
        font-size:15px;
    }

    .bubble{
        max-width:85%;
    }

}

</style>

</head>


<body>


<!-- CHAT -->

<div
    class="chat-container"
    id="chatContainer"
>

    <div
        class="welcome"
        id="welcome"
    >

        <h1>
            Let's Practice English 🩵
        </h1>

        <p>
            Talk with AI and improve your English conversation.
        </p>

    </div>

</div>



<!-- START CONVERSATION BUTTON -->

<div class="input-area">

    <button
        class="start-conversation-btn"
        id="startConversation"
        onclick="startConversation()"
    >

        🗣️ Start Conversation

    </button>

</div>



<script>

function startConversation(){

    /*
       இங்கே AI conversation start செய்யலாம்.
       அடுத்த step-ல்:

       1. Microphone permission
       2. User English பேசுவது
       3. Speech → Text
       4. Gemini AI
       5. AI reply
       6. AI Voice reply

       எல்லாம் connect செய்யலாம்.
    */

    console.log("AI Conversation Started");

}

</script>


</body>
</html>
