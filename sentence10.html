    <script>
        // File 10: Sentences 901 to 1000 (10 Pages x 10 Sentences)
        const file10Sentences = [
            // Page 1 (901 - 910)
            [
                { en: "How do you achieve long-term success?", ta: "நீண்ட கால வெற்றியை எவ்வாறு அடைவது?" },
                { en: "Consistency is the key to success.", ta: "தொடர் முயற்சியே வெற்றிக்கு முக்கியக் காரணமாகும்." },
                { en: "Never give up on your dreams.", ta: "உங்கள் கனவுகளை ஒருபோதும் கைவிடாதீர்கள்." },
                { en: "Stay dedicated to your mission.", ta: "உங்கள் லட்சியத்தில் உறுதியாகவும் அர்ப்பணிப்புடனும் இருங்கள்." },
                { en: "Learn from every mistake you make.", ta: "நீங்கள் செய்யும் ஒவ்வொரு தவத்திலிருந்தும் கற்றுக்கொள்ளுங்கள்." },
                { en: "Adapt to changes quickly.", ta: "மாற்றங்களுக்கு ஏற்ப விரைவாக உங்களை மாற்றிக் கொள்ளுங்கள்." },
                { en: "Embrace challenges with enthusiasm.", ta: "சவால்களை ஆர்வத்துடன் ஏற்றுக்கொள்ளுங்கள்." },
                { en: "Keep your vision clear and sharp.", ta: "உங்கள் தொலைநோக்குப் பார்வையைத் தெளிவாகவும் துல்லியமாகவும் வைத்துக் கொள்ளுங்கள்." },
                { en: "Patience and persistence win the race.", ta: "பொறுமையும் விடாமுயற்சியும் போட்டியில் வெல்லும்." },
                { en: "Believe in the power of hard work.", ta: "கடின உழைப்பின் சக்தியை நம்புங்கள்." }
            ],
            // Page 2 (911 - 920)
            [
                { en: "What makes life truly meaningful?", ta: "வாழ்க்கையை உண்மையாகவே அர்த்தமுள்ளாக்குவது எது?" },
                { en: "Loving and caring for others gives meaning.", ta: "மற்றவர்களை நேசிப்பதும் கவனித்துக்கொள்வதும் அர்த்தத்தைத் தருகிறது." },
                { en: "Finding joy in little things.", ta: "சிறிய விஷயங்களிலும் மகிழ்ச்சியைக் கண்டறிவது." },
                { en: "Living in the present moment.", ta: "தற்போதைய கணத்தில் வாழ்வது." },
                { en: "Making a positive impact on society.", ta: "சமுதாயத்தில் நேர்மறையான தாக்கத்தை ஏற்படுத்துவது." },
                { en: "Forgiving those who have hurt you.", ta: "உங்களைப் புண்படுத்தியவர்களை மன்னிப்பது." },
                { en: "Practicing kindness every single day.", ta: "ஒவ்வொரு நாளும் அன்பைப் பின்பற்றுவது." },
                { en: "Being content with what you have.", ta: "உங்களிடம் உள்ளவற்றைக் கொண்டு திருப்தியடைவது." },
                { en: "Creating wonderful memories with loved ones.", ta: "உங்களுக்குப் பிடித்தமானவர்களுடன் அழகான நினைவுகளை உருவாக்குவது." },
                { en: "Life is a precious gift to cherish.", ta: "வாழ்க்கை போற்றத்தக்க ஒரு விலைமதிப்பற்ற பரிசு." }
            ],
            // Page 3 (921 - 930)
            [
                { en: "How do you overcome fear of failure?", ta: "தோல்வி பயத்தை எப்படி வெல்வது?" },
                { en: "Realize that failure is part of growth.", ta: "தோல்வி என்பது வளர்ச்சியின் ஒரு பகுதி என்பதை உணருங்கள்." },
                { en: "Do not let fear stop you from trying.", ta: "முயற்சி செய்வதிலிருந்து பயம் உங்களைத் தடுக்க விடாதீர்கள்." },
                { en: "Analyze why things went wrong.", ta: "எது தவறாகப் போனது என்பதை ஆராயுங்கள்." },
                { en: "Make a better plan and try again.", ta: "சிறந்த திட்டத்தைத் தயாரித்து மீண்டும் முயற்சிக்கவும்." },
                { en: "Courage is not the absence of fear.", ta: "தைரியம் என்பது பயம் இல்லாதது அல்ல." },
                { en: "Courage is moving forward despite fear.", ta: "பயந்தாலும் முன்னோக்கிச் செல்வதே தைரியம்." },
                { en: "Every expert was once a beginner.", ta: "ஒவ்வொரு நிபுணரும் ஒரு காலத்தில் தொடக்கநிலையாளரே." },
                { en: "Trust your inner strength.", ta: "உங்கள் உள் வலிமையை நம்புங்கள்." },
                { en: "You can conquer anything you set your mind to.", ta: "நீங்கள் மனதார நினைக்கும் எதையும் வெல்ல முடியும்." }
            ],
            // Page 4 (931 - 940)
            [
                { en: "Why is continuous learning important?", ta: "தொடர்ச்சியான கற்றல் ஏன் முக்கியமானது?" },
                { en: "The world is evolving every second.", ta: "உலகம் ஒவ்வொரு நொடியும் பரிணாம வளர்ச்சி அடைகிறது." },
                { en: "Learning keeps your brain sharp.", ta: "கற்றல் உங்கள் மூளையைத் தீர்க்கமாக வைத்துக்கொள்கிறது." },
                { en: "New skills open new career doors.", ta: "புதிய திறன்கள் புதிய தொழில் வாசல்களைத் திறக்கின்றன." },
                { en: "Stay curious like a child.", ta: "குழந்தையைப் போல எல்லாவற்றையும் தெரிந்து கொள்ளும் ஆர்வத்துடன் இருங்கள்." },
                { en: "Read books, watch documentaries, explore.", ta: "புத்தகங்கள் படியுங்கள், ஆவணப்படங்களைப் பாருங்கள், ஆராயுங்கள்." },
                { en: "Ignorance is a choice, knowledge is earned.", ta: "அறியாமை என்பது ஒரு தேர்வு, அறிவு என்பது சம்பாதிக்கப்படுவது." },
                { en: "Never stop being a student of life.", ta: "வாழ்க்கையின் மாணவனாக இருப்பதை ஒருபோதும் நிறுத்தாதீர்கள்." },
                { en: "Wisdom comes from experience and learning.", ta: "ஞானம் அனுபவத்திலிருந்தும் கற்றலிலிருந்தும் வருகிறது." },
                { en: "An investment in knowledge pays the best interest.", ta: "அறிவில் செய்யப்படும் முதலீடு மிகச் சிறந்த வட்டியைக் கொடுக்கும்." }
            ],
            // Page 5 (941 - 950)
            [
                { en: "How do you maintain a positive mindset?", ta: "நேர்மறையான மனப்பான்மையை எவ்வாறு பராமரிப்பது?" },
                { en: "Start your day with positive thoughts.", ta: "உங்கள் நாளை நேர்மறையான எண்ணங்களுடன் தொடங்குங்கள்." },
                { en: "Smile often and laugh out loud.", ta: "அடிக்கடி புன்னகை செய்யுங்கள் மற்றும் சத்தமாகச் சிரிக்கவும்." },
                { en: "Surround yourself with optimistic people.", ta: "நம்பிக்கையான மக்களுடன் உங்களைச் சுற்றி வையுங்கள்." },
                { en: "Look for lessons in every hardship.", ta: "ஒவ்வொரு சிரமத்திலும் உள்ள பாடங்களைத் தேடுங்கள்." },
                { en: "Let go of past grudges and regrets.", ta: "கடந்த கால மனக்கசப்புகளையும் வருத்தங்களையும் கைவிடுங்கள்." },
                { en: "Focus on solutions, not problems.", ta: "பிரச்சினைகளில் அல்ல, தீர்வுகளில் கவனம் செலுத்துங்கள்." },
                { en: "Practice mindfulness and meditation.", ta: "நினைவாற்றல் மற்றும் தியானத்தைப் பயிற்சி செய்யுங்கள்." },
                { en: "Your thoughts shape your reality.", ta: "உங்கள் எண்ணங்களே உங்கள் யதார்த்தத்தை வடிவமைக்கின்றன." },
                { en: "Choose happiness every single day.", ta: "ஒவ்வொரு நாளும் மகிழ்ச்சியைத் தேர்ந்தெடுங்கள்." }
            ],
            // Page 6 (951 - 960)
            [
                { en: "How do you build a strong personal brand?", ta: "வலுவான தனிப்பட்ட பிராண்டை எவ்வாறு உருவாக்குவது?" },
                { en: "Be authentic and true to yourself.", ta: "உண்மையாகவும் உங்களுக்கே விசுவாசமாகவும் இருங்கள்." },
                { en: "Deliver high quality in whatever you do.", ta: "நீங்கள் செய்யும் எதிலும் உயர் தரத்தைக் கொடுங்கள்." },
                { en: "Maintain consistency in your efforts.", ta: "உங்கள் முயற்சியில் தொடர்ச்சியைப் பராமரியுங்கள்." },
                { en: "Network with professionals in your field.", ta: "உங்கள் துறையில் உள்ள நிபுணர்களுடன் தொடர்பை ஏற்படுத்துங்கள்." },
                { en: "Share your knowledge and help others.", ta: "உங்கள் அறிவைப் பகிர்ந்து மற்றவர்களுக்கு உதவுங்கள்." },
                { en: "Reputation takes years to build, seconds to lose.", ta: "நற்பெயரை உருவாக்க வருடங்கள் ஆகும், இழக்க வினாடிகள் போதும்." },
                { en: "Always keep your commitments.", ta: "எப்பொழுதும் உங்கள் வாக்குறுதிகளை நிறைவேற்றுங்கள்." },
                { en: "Ethical behavior builds lasting trust.", ta: "நெறிமுறை சார்ந்த நடத்தை நீடித்த நம்பிக்கையை உருவாக்குகிறது." },
                { en: "Let your work speak for itself.", ta: "உங்கள் பணியே உங்களுக்காகப் பேசட்டும்." }
            ],
            // Page 7 (961 - 970)
            [
                { en: "What is the secret of a peaceful mind?", ta: "அமைதியான மனதின் ரகசியம் என்ன?" },
                { en: "Accepting things you cannot change.", ta: "உங்களால் மாற்ற முடியாத விஷயங்களை ஏற்றுக்கொள்வது." },
                { en: "Letting go of anger and jealousy.", ta: "கோபம் மற்றும் பொறாமையைக் கைவிடுவது." },
                { en: "Living simply and thinking deeply.", ta: "எளிமையாக வாழ்ந்து ஆழமாகச் சிந்திப்பது." },
                { en: "Spending time in nature.", ta: "இயற்கையில் நேரத்தைச் செலவிடுவது." },
                { en: "Doing good deeds without expectations.", ta: "எந்தவித எதிர்பார்ப்பும் இல்லாமல் நல்ல செயல்களைச் செய்வது." },
                { en: "Finding joy in silence and solitude.", ta: "மௌனத்திலும் தனிமையிலும் மகிழ்ச்சியைக் கண்டறிவது." },
                { en: "Not reacting to every criticism.", ta: "ஒவ்வொரு விமர்சகனுக்கும் எதிர்வினையாற்றாமல் இருப்பது." },
                { en: "Trusting the timing of your life.", ta: "உங்கள் வாழ்க்கையின் நேரத்தை (Timing) நம்புவது." },
                { en: "Peace comes from within, do not seek it outside.", ta: "அமைதி உள்ளிருந்து வருகிறது, அதை வெளியே தேடாதீர்கள்." }
            ],
            // Page 8 (971 - 980)
            [
                { en: "How do you set and achieve goals?", ta: "இலக்குகளை எவ்வாறு நிர்ணயித்து அடைவது?" },
                { en: "Set SMART goals (Specific, Measurable, Achievable).", ta: "SMART இலக்குகளை நிர்ணயிக்கவும் (குறிப்பிட்ட, அளவிடக்கூடிய, அடையக்கூடிய)." },
                { en: "Break large goals into smaller tasks.", ta: "பெரிய இலக்குகளைச் சிறிய வேலைகளாகப் பிரிக்கவும்." },
                { en: "Track your daily progress.", ta: "உங்கள் தினசரி முன்னேற்றத்தைக் கண்காணிக்கவும்." },
                { en: "Stay disciplined and committed.", ta: "ஒழுக்கத்துடனும் அர்ப்பணிப்புடனும் இருங்கள்." },
                { en: "Overcome laziness and take action.", ta: "சோம்பலை வென்று செயலில் இறங்குங்கள்." },
                { en: "Visualize your success every morning.", ta: "ஒவ்வொரு காலையிலும் உங்கள் வெற்றியை மனக்கண்ணில் காணுங்கள்." },
                { en: "Reward yourself upon hitting milestones.", ta: "மைல்கற்களை எட்டும்போது உங்களைப் பரிசளித்துக் கொள்ளுங்கள்." },
                { en: "Stay adaptable if plans change.", ta: "திட்டங்கள் மாறினால் அதற்கு ஏற்ப உங்களை மாற்றிக் கொள்ளுங்கள்." },
                { en: "Persistence guarantees eventual success.", ta: "விடாமுயற்சி இறுதியில் வெற்றியை உறுதி செய்யும்." }
            ],
            // Page 9 (981 - 990)
            [
                { en: "How do you leave a positive impact on people?", ta: "மக்கள் மீது நேர்மறையான தாக்கத்தை எப்படி விட்டுச் செல்வது?" },
                { en: "Treat everyone with respect and dignity.", ta: "அனைவரையும் மரியாதையுடனும் கண்ணியத்துடனும் நடத்துங்கள்." },
                { en: "Listen patiently when someone speaks.", ta: "யாரಾದರೂ பேசும்போது பொறுமையாகக் கேளுங்கள்." },
                { en: "Offer help without being asked.", ta: "கேட்காமலேயே உதவி செய்யுங்கள்." },
                { en: "Leave places cleaner than you found them.", ta: "நீங்கள் சென்ற இடங்களை நீங்கள் கண்டறிந்ததை விடச் சுத்தமாக விட்டுச் செல்லுங்கள்." },
                { en: "Speak words of encouragement.", ta: "ஊக்கமளிக்கும் வார்த்தைகளைப் பேசுங்கள்." },
                { en: "Be a source of light in someone's darkness.", ta: "யாருடைய இருளிலும் ஒளியாக மாறுங்கள்." },
                { en: "Acts of kindness linger forever.", ta: "அன்பான செயல்கள் எப்போதும் நிலைத்திருக்கும்." },
                { en: "Be remembered for your generous heart.", ta: "உங்கள் பெருந்தன்மையான இதயத்திற்காக நினைவுகூரப்படுங்கள்." },
                { en: "Make the world a slightly better place.", ta: "உலகத்தை இன்னும் கொஞ்சம் சிறந்த இடமாக மாற்றுங்கள்." }
            ],
            // Page 10 (991 - 1000)
            [
                { en: "How does it feel to reach this milestone?", ta: "இந்த மைல்கல்லை எட்டியது எப்படி இருக்கிறது?" },
                { en: "This is a moment of great pride and joy.", ta: "இது பெருமையும் மகிழ்ச்சியும் நிறைந்த ஒரு தருணமாகும்." },
                { en: "You have successfully learned 1000 sentences!", ta: "நீங்கள் வெற்றிகரமாக 1000 வாக்கியங்களைக் கற்றுவிட்டீர்கள்!" },
                { en: "Your dedication has truly paid off.", ta: "உங்கள் அர்ப்பணிப்புக்கு உண்மையான பலன் கிடைத்துள்ளது." },
                { en: "You can now converse with great confidence.", ta: "இப்போது உங்களால் பெரும் நம்பிக்கையுடன் உரையாட முடியும்." },
                { en: "Keep practicing and refining your skills.", ta: "தொடர்ந்து பயிற்சி செய்து உங்கள் திறன்களை மெருகேற்றுங்கள்." },
                { en: "Never stop your journey of English learning.", ta: "உங்கள் ஆங்கிலக் கற்றல் பயணத்தை ஒருபோதும் நிறுத்தாதீர்கள்." },
                { en: "You have achieved something extraordinary today.", ta: "இன்று நீங்கள் ஒரு அசாதாரணமான சாதனையைச் செய்துள்ளீர்கள்." },
                { en: "Heartiest congratulations on completing 1000 sentences!", ta: "1000 வாக்கியங்களை நிறைவு செய்தமைக்கு எனது மனமார்ந்த வாழ்த்துகள்!" },
                { en: "Wish you grand success in your future endeavors!", ta: "உங்கள் எதிர்கால முயற்சிகளில் மாபெரும் வெற்றிபெற வாழ்த்துகிறேன்!" }
            ]
        ];

        let currentPage = 0;

        // Populate dropdown options
        const selectEl = document.getElementById('pageSelect');
        for (let i = 0; i < file10Sentences.length; i++) {
            let opt = document.createElement('option');
            opt.value = i;
            opt.innerText = `பகுதி ${i + 1} (வாக்கியங்கள் ${901 + (i*10)} - ${900 + ((i+1)*10)})`;
            selectEl.appendChild(opt);
        }

        function renderPage() {
            const container = document.getElementById('sentenceContainer');
            const pageData = file10Sentences[currentPage];
            
            let html = '';
            pageData.forEach((item, index) => {
                let sentenceNo = 901 + (currentPage * 10) + index;
                html += `
                    <div class="bg-blue-50/70 border border-blue-100 rounded-2xl p-3 flex flex-col gap-0.5 shadow-sm">
                        <span class="text-[10px] font-bold text-blue-500">#${sentenceNo}</span>
                        <p class="text-xs sm:text-sm font-bold text-blue-900">${item.en}</p>
                        <p class="text-[11px] sm:text-xs font-medium text-gray-600">${item.ta}</p>
                    </div>
                `;
            });
            container.innerHTML = html;

            document.getElementById('pageCountDisplay').innerText = `${currentPage + 1} / 10`;
            selectEl.value = currentPage;

            document.getElementById('prevBtn').disabled = currentPage === 0;
            document.getElementById('nextBtn').disabled = currentPage === file10Sentences.length - 1;
        }

        function changePage(direction) {
            currentPage += direction;
            if (currentPage < 0) currentPage = 0;
            if (currentPage >= file10Sentences.length) currentPage = file10Sentences.length - 1;
            renderPage();
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function jumpToPage(pageIndex) {
            currentPage = parseInt(pageIndex);
            renderPage();
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        // முதல் பக்கத்தை ஏற்றுதல்
        renderPage();
    </script>
</body>
</html>
