<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Level 1 - Basic English</title>

<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Tamil:wght@400;500;600;700;800&family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<style>

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    font-family:"Poppins","Noto Sans Tamil",sans-serif;
    background:linear-gradient(135deg,#eaf7ff,#d9f0ff);
    min-height:100vh;
    padding:20px 12px;
    color:#123;
}

.container{
    max-width:850px;
    margin:auto;
}

/* SECTION */

.section{
    background:white;
    border-radius:24px;
    padding:25px;
    margin-bottom:20px;
    box-shadow:0 8px 25px rgba(0,100,180,0.10);
}

.title{
    text-align:center;
    color:#087dcc;
    font-size:28px;
    font-weight:800;
    margin-bottom:8px;
}

.subtitle{
    text-align:center;
    color:#64748b;
    font-size:14px;
    margin-bottom:25px;
}

/* XP */

.xp-area{
    margin-bottom:25px;
}

.xp-top{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:8px;
    font-weight:700;
}

.xp{
    color:#087dcc;
}

.progress{
    height:10px;
    background:#e5f3fb;
    border-radius:20px;
    overflow:hidden;
}

.progress-bar{
    height:100%;
    width:0%;
    background:#1597e5;
    border-radius:20px;
    transition:0.4s;
}

/* WORD CARD */

.word-card{
    border:2px solid #e4f2fa;
    border-radius:18px;
    padding:18px;
    margin-bottom:15px;
    transition:0.3s;
}

.word-card.correct{
    border-color:#22c55e;
    background:#f0fdf4;
}

.word-row{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:15px;
}

.english-word{
    font-size:20px;
    font-weight:700;
    color:#123;
    min-width:110px;
}

.meanings{
    display:flex;
    gap:8px;
    flex-wrap:wrap;
    justify-content:flex-end;
}

.meaning-btn{
    border:2px solid #cceafa;
    background:#f5fbff;
    color:#087dcc;
    padding:9px 13px;
    border-radius:12px;
    font-family:"Noto Sans Tamil","Poppins",sans-serif;
    font-size:14px;
    font-weight:600;
    cursor:pointer;
    transition:0.2s;
}

.meaning-btn:hover{
    background:#e3f5ff;
    transform:translateY(-2px);
}

.meaning-btn.wrong{
    background:#fee2e2;
    border-color:#ef4444;
    color:#dc2626;
}

.meaning-btn.correct-btn{
    background:#dcfce7;
    border-color:#22c55e;
    color:#15803d;
}

/* GAME */

#gameSection{
    display:none;
}

.question-number{
    text-align:center;
    color:#64748b;
    font-size:14px;
    margin-bottom:8px;
}

.sentence{
    text-align:center;
    font-size:24px;
    font-weight:800;
    color:#087dcc;
    margin:10px 0 5px;
}

.tamil-meaning{
    text-align:center;
    font-family:"Noto Sans Tamil";
    color:#64748b;
    margin-bottom:25px;
}

/* ANSWER BOX */

.answer-box{
    min-height:65px;
    border:2px dashed #8dd0f4;
    border-radius:16px;
    padding:10px;
    display:flex;
    flex-wrap:wrap;
    gap:8px;
    align-items:center;
    margin-bottom:20px;
    background:#f8fdff;
}

.answer-placeholder{
    color:#94a3b8;
    width:100%;
    text-align:center;
    font-size:14px;
}

.word-chip{
    background:#087dcc;
    color:white;
    border:none;
    padding:10px 15px;
    border-radius:12px;
    font-family:"Poppins",sans-serif;
    font-size:15px;
    font-weight:600;
    cursor:pointer;
}

/* WORD BANK */

.word-bank{
    display:flex;
    flex-wrap:wrap;
    gap:10px;
    justify-content:center;
    margin-bottom:20px;
}

.bank-word{
    border:2px solid #cceafa;
    background:white;
    color:#087dcc;
    padding:10px 15px;
    border-radius:12px;
    font-size:15px;
    font-weight:600;
    cursor:pointer;
    transition:0.2s;
}

.bank-word:hover{
    background:#e8f7ff;
    transform:translateY(-2px);
}

.bank-word.used{
    opacity:0.35;
    pointer-events:none;
}

/* BUTTON */

.check-btn,
.next-btn,
.start-btn{
    width:100%;
    border:none;
    padding:14px;
    border-radius:14px;
    background:#087dcc;
    color:white;
    font-family:"Poppins",sans-serif;
    font-size:16px;
    font-weight:700;
    cursor:pointer;
    transition:0.2s;
}

.check-btn:hover,
.next-btn:hover,
.start-btn:hover{
    background:#0569ad;
    transform:translateY(-1px);
}

.next-btn{
    display:none;
    margin-top:10px;
}

.feedback{
    text-align:center;
    min-height:28px;
    font-weight:700;
    margin:10px 0;
}

.success{
    color:#16a34a;
}

.error{
    color:#dc2626;
}

/* COMPLETE */

#completeSection{
    display:none;
    text-align:center;
}

.complete-icon{
    font-size:70px;
    margin-bottom:10px;
}

.complete-title{
    font-size:30px;
    font-weight:800;
    color:#087dcc;
    margin-bottom:10px;
}

.complete-text{
    color:#64748b;
    margin-bottom:20px;
}

.final-xp{
    display:inline-block;
    background:#e5f6ff;
    color:#087dcc;
    padding:12px 25px;
    border-radius:15px;
    font-size:20px;
    font-weight:800;
    margin-bottom:20px;
}

/* RESPONSIVE */

@media(max-width:600px){

    body{
        padding:12px 8px;
    }

    .section{
        padding:18px;
        border-radius:20px;
    }

    .title{
        font-size:23px;
    }

    .word-row{
        align-items:flex-start;
        flex-direction:column;
    }

    .english-word{
        font-size:19px;
    }

    .meanings{
        width:100%;
        justify-content:flex-start;
    }

    .meaning-btn{
        flex:1;
        min-width:90px;
    }

    .sentence{
        font-size:21px;
    }

    .bank-word{
        padding:9px 12px;
        font-size:14px;
    }

}

</style>
</head>

<body>

<div class="container">

    <!-- LEARN SECTION -->

    <div class="section" id="learnSection">

        <div class="title">
            Level 1 🚀
        </div>

        <div class="subtitle">
            Learn 10 Basic English Words
        </div>

        <div class="xp-area">

            <div class="xp-top">
                <span>Progress</span>
                <span class="xp" id="xpText">0 XP</span>
            </div>

            <div class="progress">
                <div class="progress-bar" id="progressBar"></div>
            </div>

        </div>

        <div id="wordsContainer"></div>

        <button class="start-btn" id="startGameBtn" style="display:none;">
            Start Sentence Game →
        </button>

    </div>


    <!-- SENTENCE GAME -->

    <div class="section" id="gameSection">

        <div class="title">
            Sentence Making 🧩
        </div>

        <div class="question-number" id="questionNumber">
            Question 1 / 10
        </div>

        <div class="sentence">
            Make this sentence 👇
        </div>

        <div class="tamil-meaning" id="tamilMeaning">
        </div>

        <div class="answer-box" id="answerBox">
            <div class="answer-placeholder">
                Click the words below to make the sentence
            </div>
        </div>

        <div class="word-bank" id="wordBank"></div>

        <div class="feedback" id="feedback"></div>

        <button class="check-btn" id="checkBtn">
            Check Answer ✓
        </button>

        <button class="next-btn" id="nextBtn">
            Next Question →
        </button>

    </div>


    <!-- COMPLETE -->

    <div class="section" id="completeSection">

        <div class="complete-icon">
            🎉
        </div>

        <div class="complete-title">
            Level 1 Complete!
        </div>

        <div class="complete-text">
            Great job! You completed all 10 words and sentences.
        </div>

        <div class="final-xp" id="finalXP">
            100 XP
        </div>

        <button class="start-btn" onclick="location.reload()">
            Play Again 🔄
        </button>

    </div>

</div>


<script>

/* =========================
   WORDS
========================= */

const learningWords = [

    {
        word:"I",
        meaning:"நான்"
    },

    {
        word:"You",
        meaning:"நீ / நீங்கள்"
    },

    {
        word:"Eat",
        meaning:"சாப்பிடு"
    },

    {
        word:"Drink",
        meaning:"குடி"
    },

    {
        word:"Go",
        meaning:"போ"
    },

    {
        word:"Come",
        meaning:"வா"
    },

    {
        word:"Sit",
        meaning:"உட்கார்"
    },

    {
        word:"Stand",
        meaning:"நில்"
    },

    {
        word:"Read",
        meaning:"படி"
    },

    {
        word:"Write",
        meaning:"எழுது"
    }

];


/* =========================
   SENTENCES
========================= */

const questions = [

    {
        answer:["I","eat"],
        tamil:"நான் சாப்பிடுகிறேன்"
    },

    {
        answer:["I","drink"],
        tamil:"நான் குடிக்கிறேன்"
    },

    {
        answer:["I","go"],
        tamil:"நான் போகிறேன்"
    },

    {
        answer:["I","come"],
        tamil:"நான் வருகிறேன்"
    },

    {
        answer:["You","sit"],
        tamil:"நீ உட்காருகிறாய்"
    },

    {
        answer:["You","stand"],
        tamil:"நீ நிற்கிறாய்"
    },

    {
        answer:["I","read"],
        tamil:"நான் படிக்கிறேன்"
    },

    {
        answer:["You","write"],
        tamil:"நீ எழுதுகிறாய்"
    },

    {
        answer:["I","sit"],
        tamil:"நான் உட்காருகிறேன்"
    },

    {
        answer:["You","eat"],
        tamil:"நீ சாப்பிடுகிறாய்"
    }

];


/* =========================
   VARIABLES
========================= */

let learnedWords = 0;

let xp = 0;

let currentQuestion = 0;

let selectedWords = [];

let mistakes = 0;


/* =========================
   BEEP SOUND
========================= */

function beep(type){

    const audioContext =
        new (window.AudioContext || window.webkitAudioContext)();

    const oscillator =
        audioContext.createOscillator();

    const gain =
        audioContext.createGain();

    oscillator.connect(gain);

    gain.connect(audioContext.destination);

    if(type === "good"){

        oscillator.frequency.value = 800;

    }else{

        oscillator.frequency.value = 250;

    }

    gain.gain.setValueAtTime(
        0.15,
        audioContext.currentTime
    );

    gain.gain.exponentialRampToValueAtTime(
        0.001,
        audioContext.currentTime + 0.2
    );

    oscillator.start();

    oscillator.stop(
        audioContext.currentTime + 0.2
    );

}


/* =========================
   SHUFFLE
========================= */

function shuffle(array){

    return array
        .sort(() => Math.random() - 0.5);

}


/* =========================
   CREATE WORDS
========================= */

function createLearningWords(){

    const container =
        document.getElementById("wordsContainer");

    learningWords.forEach((item,index)=>{

        const card =
            document.createElement("div");

        card.className = "word-card";

        card.id = "wordCard" + index;

        let wrongMeanings =
            learningWords
            .filter(x => x.meaning !== item.meaning)
            .map(x => x.meaning);

        shuffle(wrongMeanings);

        let options = [

            item.meaning,

            wrongMeanings[0],

            wrongMeanings[1]

        ];

        shuffle(options);

        card.innerHTML = `

            <div class="word-row">

                <div class="english-word">
                    ${item.word}
                </div>

                <div class="meanings">

                    ${options.map(option => `

                        <button
                            class="meaning-btn"
                            onclick="checkMeaning(
                                this,
                                '${item.meaning.replace(/'/g,"\\'")}',
                                ${index}
                            )">

                            ${option}

                        </button>

                    `).join("")}

                </div>

            </div>

        `;

        container.appendChild(card);

    });

}


/* =========================
   CHECK MEANING
========================= */

function checkMeaning(button,correct,index){

    const card =
        document.getElementById("wordCard"+index);

    if(card.classList.contains("correct")){

        return;

    }

    if(button.innerText.trim() === correct){

        button.classList.add("correct-btn");

        card.classList.add("correct");

        const buttons =
            card.querySelectorAll(".meaning-btn");

        buttons.forEach(btn=>{
            btn.disabled = true;
        });

        learnedWords++;

        beep("good");

        updateProgress();

        if(learnedWords === learningWords.length){

            document.getElementById("startGameBtn").style.display="block";

        }

    }else{

        button.classList.add("wrong");

        beep("bad");

        setTimeout(()=>{

            button.classList.remove("wrong");

        },500);

    }

}


/* =========================
   PROGRESS
========================= */

function updateProgress(){

    const percentage =
        (learnedWords / learningWords.length) * 100;

    document.getElementById("progressBar").style.width =
        percentage + "%";

    document.getElementById("xpText").innerText =
        xp + " XP";

}


/* =========================
   START GAME
========================= */

document
.getElementById("startGameBtn")
.addEventListener("click",function(){

    document.getElementById("learnSection").style.display="none";

    document.getElementById("gameSection").style.display="block";

    loadQuestion();

});


/* =========================
   LOAD QUESTION
========================= */

function loadQuestion(){

    selectedWords = [];

    mistakes = 0;

    const question =
        questions[currentQuestion];

    document.getElementById("questionNumber")
        .innerText =
        "Question " +
        (currentQuestion + 1) +
        " / " +
        questions.length;

    document.getElementById("tamilMeaning")
        .innerText =
        question.tamil;

    document.getElementById("feedback")
        .innerText = "";

    document.getElementById("checkBtn")
        .style.display = "block";

    document.getElementById("nextBtn")
        .style.display = "none";

    renderAnswerBox();

    createWordBank();

}


/* =========================
   CREATE WORD BANK
========================= */

function createWordBank(){

    const bank =
        document.getElementById("wordBank");

    bank.innerHTML = "";

    const question =
        questions[currentQuestion];

    let words = [...question.answer];

    /* ADD DISTRACTOR */

    const distractors = [

        "drink",
        "go",
        "come",
        "sit",
        "stand",
        "read",
        "write",
        "eat",
        "You",
        "I"
    ];

    const available =
        distractors.filter(
            word => !words.includes(word)
        );

    words.push(
        available[
            Math.floor(
                Math.random() *
                available.length
            )
        ]
    );

    shuffle(words);

    words.forEach((word,index)=>{

        const button =
            document.createElement("button");

        button.className = "bank-word";

        button.innerText = word;

        button.dataset.index = index;

        button.onclick = function(){

            selectWord(word,button);

        };

        bank.appendChild(button);

    });

}


/* =========================
   SELECT WORD
========================= */

function selectWord(word,button){

    if(button.classList.contains("used")){

        return;

    }

    selectedWords.push(word);

    button.classList.add("used");

    renderAnswerBox();

}


/* =========================
   ANSWER BOX
========================= */

function renderAnswerBox(){

    const box =
        document.getElementById("answerBox");

    if(selectedWords.length === 0){

        box.innerHTML = `

            <div class="answer-placeholder">
                Click the words below to make the sentence
            </div>

        `;

        return;

    }

    box.innerHTML = "";

    selectedWords.forEach((word,index)=>{

        const chip =
            document.createElement("button");

        chip.className = "word-chip";

        chip.innerText = word;

        chip.onclick = function(){

            removeWord(index);

        };

        box.appendChild(chip);

    });

}


/* =========================
   REMOVE WORD
========================= */

function removeWord(index){

    selectedWords.splice(index,1);

    renderAnswerBox();

    const bankWords =
        document.querySelectorAll(".bank-word");

    bankWords.forEach(button=>{

        if(button.innerText ===
           selectedWords[
               selectedWords.length - 1
           ]){

            button.classList.remove("used");

        }

    });

    /*
       Better reset bank based on
       current selected words
    */

    const usedCount = {};

    selectedWords.forEach(word=>{

        usedCount[word] =
            (usedCount[word] || 0) + 1;

    });

    bankWords.forEach(button=>{

        const word =
            button.innerText;

        const totalUsed =
            [...selectedWords]
            .filter(x => x === word)
            .length;

        if(totalUsed === 0){

            button.classList.remove("used");

        }

    });

}


/* =========================
   CHECK ANSWER
========================= */

document
.getElementById("checkBtn")
.addEventListener("click",checkAnswer);


function checkAnswer(){

    const correct =
        questions[currentQuestion].answer;

    const isCorrect =
        selectedWords.length === correct.length &&
        selectedWords.every(
            (word,index) =>
                word === correct[index]
        );

    const feedback =
        document.getElementById("feedback");

    if(isCorrect){

        beep("good");

        xp += 10;

        feedback.innerText =
            "Correct! 🎉 +10 XP";

        feedback.className =
            "feedback success";

        document.getElementById("checkBtn")
            .style.display="none";

        document.getElementById("nextBtn")
            .style.display="block";

        document.getElementById("xpText")
            .innerText =
            xp + " XP";

    }else{

        mistakes++;

        beep("bad");

        feedback.innerText =
            "Try again ❌";

        feedback.className =
            "feedback error";

        if(mistakes >= 3){

            showCorrectAnswer();

        }

    }

}


/* =========================
   SHOW CORRECT ANSWER
========================= */

function showCorrectAnswer(){

    const correct =
        questions[currentQuestion].answer;

    selectedWords = [...correct];

    renderAnswerBox();

    document.getElementById("feedback")
        .innerText =
        "Correct answer 👇";

    document.getElementById("feedback")
        .className =
        "feedback success";

    document.getElementById("checkBtn")
        .style.display="none";

    document.getElementById("nextBtn")
        .style.display="block";

}


/* =========================
   NEXT QUESTION
========================= */

document
.getElementById("nextBtn")
.addEventListener("click",function(){

    currentQuestion++;

    if(currentQuestion >= questions.length){

        finishLevel();

    }else{

        loadQuestion();

    }

});


/* =========================
   FINISH LEVEL
========================= */

function finishLevel(){

    document.getElementById("gameSection")
        .style.display="none";

    document.getElementById("completeSection")
        .style.display="block";

    document.getElementById("finalXP")
        .innerText =
        xp + " XP";

}


/* =========================
   START
========================= */

createLearningWords();

updateProgress();

</script>

</body>
</html>
