<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Level 1 - TMS Academy</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Tamil:wght@400;500;600;700&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    font-family:"Poppins","Noto Sans Tamil",sans-serif;
    background:#f0f7ff;
    min-height:100vh;
    color:#172554;
}

/* HEADER */

.header{
    background:linear-gradient(135deg,#2563eb,#4f46e5);
    color:white;
    padding:18px 15px;
    text-align:center;
    box-shadow:0 4px 15px rgba(37,99,235,.20);
}

.logo{
    font-size:22px;
    font-weight:700;
}

.subtitle{
    font-size:12px;
    opacity:.9;
    margin-top:3px;
}

/* MAIN */

.container{
    width:100%;
    max-width:680px;
    margin:auto;
    padding:18px 12px 40px;
}

/* PROGRESS */

.top-bar{
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin-bottom:12px;
}

.level{
    font-size:14px;
    font-weight:700;
    color:#2563eb;
}

.count{
    font-size:13px;
    font-weight:600;
    color:#64748b;
}

.progress{
    height:8px;
    background:#dbeafe;
    border-radius:20px;
    overflow:hidden;
    margin-bottom:18px;
}

.progress-fill{
    height:100%;
    width:0%;
    background:linear-gradient(90deg,#2563eb,#4f46e5);
    border-radius:20px;
    transition:.3s;
}

/* GAME CARD */

.game{
    background:white;
    border-radius:22px;
    padding:25px 18px;
    box-shadow:0 8px 25px rgba(15,23,42,.07);
}

/* QUESTION */

.question{
    text-align:center;
    margin-bottom:25px;
}

.question-label{
    font-size:12px;
    font-weight:600;
    color:#64748b;
    margin-bottom:8px;
}

.tamil{
    font-family:"Noto Sans Tamil",sans-serif;
    font-size:24px;
    font-weight:700;
    line-height:1.8;
    color:#172554;
}

/* ANSWER */

.answer-title{
    font-size:13px;
    color:#64748b;
    font-weight:600;
    margin-bottom:8px;
}

.answer{
    min-height:65px;
    border:2px dashed #bfdbfe;
    background:#f8fbff;
    border-radius:14px;
    padding:10px;
    display:flex;
    justify-content:center;
    align-items:center;
    flex-wrap:wrap;
    gap:8px;
    margin-bottom:22px;
}

.answer-empty{
    color:#94a3b8;
    font-size:13px;
}

/* WORDS */

.words-title{
    font-size:13px;
    color:#64748b;
    text-align:center;
    margin-bottom:12px;
}

.words{
    display:flex;
    justify-content:center;
    flex-wrap:wrap;
    gap:10px;
    margin-bottom:22px;
}

.word{
    border:2px solid #bfdbfe;
    background:#eff6ff;
    color:#1d4ed8;
    border-radius:12px;
    padding:11px 16px;
    min-height:46px;
    font-family:"Poppins",sans-serif;
    font-size:15px;
    font-weight:600;
    cursor:pointer;
    box-shadow:0 2px 5px rgba(37,99,235,.08);
    transition:.15s;
}

.word:hover{
    background:#dbeafe;
    transform:translateY(-1px);
}

.word:active{
    transform:scale(.95);
}

.word.selected{
    opacity:.30;
    pointer-events:none;
}

/* SELECTED WORD */

.answer-word{
    border:none;
    background:#2563eb;
    color:white;
    border-radius:10px;
    padding:9px 13px;
    font-size:14px;
    font-weight:600;
    cursor:pointer;
    animation:pop .15s ease;
}

.answer-word:hover{
    background:#1d4ed8;
}

@keyframes pop{
    from{
        transform:scale(.8);
    }
    to{
        transform:scale(1);
    }
}

/* CHECK BUTTON */

.check{
    width:100%;
    border:none;
    background:linear-gradient(135deg,#2563eb,#4f46e5);
    color:white;
    padding:15px;
    border-radius:13px;
    font-family:"Poppins",sans-serif;
    font-size:16px;
    font-weight:700;
    cursor:pointer;
    box-shadow:0 5px 12px rgba(37,99,235,.20);
    transition:.15s;
}

.check:hover{
    transform:translateY(-1px);
}

.check:active{
    transform:scale(.98);
}

/* RESULT */

.result{
    min-height:30px;
    text-align:center;
    margin-top:14px;
    font-size:15px;
    font-weight:700;
}

.correct{
    color:#16a34a;
}

.wrong{
    color:#dc2626;
}

.show-answer{
    color:#f59e0b;
}

/* NEXT */

.next{
    display:none;
    width:100%;
    border:none;
    background:#16a34a;
    color:white;
    padding:15px;
    border-radius:13px;
    font-family:"Poppins",sans-serif;
    font-size:16px;
    font-weight:700;
    cursor:pointer;
    margin-top:8px;
}

/* COMPLETE */

.complete{
    display:none;
    text-align:center;
}

.complete-icon{
    font-size:65px;
    margin-bottom:10px;
}

.complete h2{
    color:#2563eb;
    font-size:25px;
    margin-bottom:8px;
}

.complete p{
    color:#64748b;
    font-size:14px;
    line-height:1.7;
    margin-bottom:20px;
}

.complete a{
    display:block;
    text-decoration:none;
    background:linear-gradient(135deg,#2563eb,#4f46e5);
    color:white;
    padding:14px;
    border-radius:13px;
    font-weight:700;
}

/* SHAKE */

.shake{
    animation:shake .35s;
}

@keyframes shake{

    0%,100%{
        transform:translateX(0);
    }

    25%{
        transform:translateX(-6px);
    }

    50%{
        transform:translateX(6px);
    }

    75%{
        transform:translateX(-4px);
    }
}

/* MOBILE */

@media(max-width:500px){

    .container{
        padding:14px 9px 30px;
    }

    .game{
        padding:22px 13px;
        border-radius:18px;
    }

    .tamil{
        font-size:20px;
    }

    .word{
        font-size:14px;
        padding:10px 13px;
    }

    .answer-word{
        font-size:13px;
        padding:8px 11px;
    }

}

</style>
</head>

/* =========================================================
   GAME VARIABLES
   ========================================================= */

let current = 0;
let selected = [];
let mistakes = 0;
let locked = false;


/* =========================================================
   SOUND
   No external audio file required.
   Browser creates the sounds automatically.
   ========================================================= */

let audioContext;

function getAudio(){

    if(!audioContext){

        audioContext =
            new (window.AudioContext ||
            window.webkitAudioContext)();

    }

    if(audioContext.state === "suspended"){
        audioContext.resume();
    }

    return audioContext;
}


/* CORRECT SOUND */

function correctSound(){

    const ctx = getAudio();

    const now = ctx.currentTime;

    const osc = ctx.createOscillator();
    const gain = ctx.createGain();

    osc.type = "sine";

    osc.frequency.setValueAtTime(523.25,now);
    osc.frequency.setValueAtTime(659.25,now + .10);
    osc.frequency.setValueAtTime(783.99,now + .20);

    gain.gain.setValueAtTime(.0001,now);
    gain.gain.exponentialRampToValueAtTime(.25,now + .02);
    gain.gain.exponentialRampToValueAtTime(.0001,now + .40);

    osc.connect(gain);
    gain.connect(ctx.destination);

    osc.start(now);
    osc.stop(now + .42);
}


/* WRONG SOUND */

function wrongSound(){

    const ctx = getAudio();

    const now = ctx.currentTime;

    const osc = ctx.createOscillator();
    const gain = ctx.createGain();

    osc.type = "sawtooth";

    osc.frequency.setValueAtTime(220,now);
    osc.frequency.setValueAtTime(150,now + .18);

    gain.gain.setValueAtTime(.0001,now);
    gain.gain.exponentialRampToValueAtTime(.18,now + .02);
    gain.gain.exponentialRampToValueAtTime(.0001,now + .28);

    osc.connect(gain);
    gain.connect(ctx.destination);

    osc.start(now);
    osc.stop(now + .3);
}


/* COMPLETE SOUND */

function completeSound(){

    const ctx = getAudio();

    const notes = [
        523.25,
        659.25,
        783.99,
        1046.50
    ];

    notes.forEach((frequency,index)=>{

        const now =
            ctx.currentTime + index * .12;

        const osc =
            ctx.createOscillator();

        const gain =
            ctx.createGain();

        osc.type = "sine";

        osc.frequency.value = frequency;

        gain.gain.setValueAtTime(.0001,now);
        gain.gain.exponentialRampToValueAtTime(
            .25,
            now + .02
        );

        gain.gain.exponentialRampToValueAtTime(
            .0001,
            now + .25
        );

        osc.connect(gain);
        gain.connect(ctx.destination);

        osc.start(now);
        osc.stop(now + .27);

    });

}


/* =========================================================
   SHUFFLE
   ========================================================= */

function shuffle(array){

    const arr = [...array];

    for(let i = arr.length - 1; i > 0; i--){

        const j =
            Math.floor(Math.random() * (i + 1));

        [arr[i],arr[j]] =
            [arr[j],arr[i]];

    }

    return arr;
}


/* =========================================================
   LOAD SENTENCE
   ========================================================= */

function loadSentence(){

    const question =
        sentences[current];

    selected = [];
    mistakes = 0;
    locked = false;

    document.getElementById("tamil")
        .textContent = question.tamil;

    document.getElementById("count")
        .textContent =
        `${current + 1} / ${sentences.length}`;

    document.getElementById("progressFill")
        .style.width =
        `${((current + 1) / sentences.length) * 100}%`;

    document.getElementById("result")
        .textContent = "";

    document.getElementById("check")
        .style.display = "block";

    document.getElementById("next")
        .style.display = "none";

    showWords();

    showAnswer();

}


/* =========================================================
   WORD BUTTONS
   ========================================================= */

function showWords(){

    const box =
        document.getElementById("words");

    box.innerHTML = "";

    shuffle(
        sentences[current].answer
    ).forEach((word,index)=>{

        const button =
            document.createElement("button");

        button.className = "word";

        button.textContent = word;

        button.dataset.index = index;

        button.onclick = function(){

            if(locked) return;

            if(
                button.classList.contains("selected")
            ){
                return;
            }

            selected.push({
                word:word,
                id:index
            });

            button.classList.add("selected");

            showAnswer();

        };

        box.appendChild(button);

    });

}


/* =========================================================
   SHOW ANSWER
   ========================================================= */

function showAnswer(){

    const box =
        document.getElementById("answer");

    box.innerHTML = "";

    if(selected.length === 0){

        const empty =
            document.createElement("div");

        empty.className = "answer-empty";

        empty.textContent =
            "Select the words to make a sentence";

        box.appendChild(empty);

        return;

    }

    selected.forEach((item,index)=>{

        const word =
            document.createElement("button");

        word.className = "answer-word";

        word.textContent = item.word;

        word.onclick = function(){

            if(locked) return;

            selected.splice(index,1);

            const buttons =
                document.querySelectorAll(".word");

            buttons.forEach(button=>{

                if(
                    button.textContent === item.word &&
                    button.classList.contains("selected")
                ){

                    button.classList.remove("selected");

                    return;
                }

            });

            showAnswer();

        };

        box.appendChild(word);

    });

}


/* =========================================================
   CHECK ANSWER
   ========================================================= */

function checkAnswer(){

    if(locked) return;

    const result =
        document.getElementById("result");

    if(selected.length === 0){

        result.textContent =
            "Select the words first.";

        result.className =
            "result wrong";

        wrongSound();

        return;
    }


    const userAnswer =
        selected
            .map(item=>item.word)
            .join(" ");

    const correctAnswer =
        sentences[current]
            .answer
            .join(" ");


    /* CORRECT */

    if(
        userAnswer.toLowerCase() ===
        correctAnswer.toLowerCase()
    ){

        locked = true;

        correctSound();

        result.textContent =
            "Correct! 🎉";

        result.className =
            "result correct";

        document.getElementById("check")
            .style.display = "none";

        document.getElementById("next")
            .style.display = "block";

        return;
    }


    /* WRONG */

    mistakes++;

    wrongSound();

    document.querySelector(".game")
        .classList.remove("shake");

    void document.querySelector(".game").offsetWidth;

    document.querySelector(".game")
        .classList.add("shake");


    if(mistakes === 1){

        result.textContent =
            "Wrong! Try again ❌";

        result.className =
            "result wrong";

        setTimeout(()=>{

            selected = [];

            document
                .querySelectorAll(".word")
                .forEach(button=>{

                    button.classList.remove(
                        "selected"
                    );

                });

            showAnswer();

        },500);

        return;
    }


    /* SECOND MISTAKE */

    locked = true;

    selected =
        sentences[current]
            .answer
            .map(word=>({
                word:word,
                id:-1
            }));

    showAnswer();

    result.textContent =
        "Correct answer is shown above.";

    result.className =
        "result show-answer";

    document.getElementById("check")
        .style.display = "none";

    document.getElementById("next")
        .style.display = "block";

}


/* =========================================================
   NEXT
   ========================================================= */

function nextSentence(){

    current++;

    if(current >= sentences.length){

        completeSound();

        document.getElementById("game")
            .style.display = "none";

        document.getElementById("complete")
            .style.display = "block";

        return;
    }

    loadSentence();

}


/* =========================================================
   START
   ========================================================= */

loadSentence();

</script>
