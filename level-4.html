/* =====================================================
   SHUFFLE WORDS
   ===================================================== */

function shuffle(array){

    for(let i=array.length-1;i>0;i--){

        const j=Math.floor(
            Math.random()*(i+1)
        );

        [array[i],array[j]]=
        [array[j],array[i]];

    }

    return array;
}


/* =====================================================
   SUCCESS SOUND
   ===================================================== */

function successSound(){

    const AudioContext =
        window.AudioContext ||
        window.webkitAudioContext;

    if(!AudioContext) return;

    const audio = new AudioContext();

    const oscillator =
        audio.createOscillator();

    const gain =
        audio.createGain();

    oscillator.frequency.value = 700;

    gain.gain.setValueAtTime(
        0.12,
        audio.currentTime
    );

    gain.gain.exponentialRampToValueAtTime(
        0.001,
        audio.currentTime + 0.3
    );

    oscillator.connect(gain);
    gain.connect(audio.destination);

    oscillator.start();
    oscillator.stop(
        audio.currentTime + 0.3
    );
}


/* =====================================================
   WRONG SOUND
   ===================================================== */

function wrongSound(){

    const AudioContext =
        window.AudioContext ||
        window.webkitAudioContext;

    if(!AudioContext) return;

    const audio = new AudioContext();

    const oscillator =
        audio.createOscillator();

    const gain =
        audio.createGain();

    oscillator.type = "square";

    oscillator.frequency.value = 180;

    gain.gain.setValueAtTime(
        0.15,
        audio.currentTime
    );

    gain.gain.exponentialRampToValueAtTime(
        0.001,
        audio.currentTime + 0.2
    );

    oscillator.connect(gain);
    gain.connect(audio.destination);

    oscillator.start();
    oscillator.stop(
        audio.currentTime + 0.2
    );
}

    if(currentIndex >= questions.length){

        finishLevel();
        return;
    }

    const q = questions[currentIndex];

    tamilSentence.textContent =
        q.tamil;

    typeBadge.textContent =
        q.type;

    currentCount.textContent =
        currentIndex + 1;

    progressBar.style.width =
        ((currentIndex / questions.length) * 100) + "%";

    selectedWords = [];

    wrongAttempts = 0;

    questionLocked = false;

    result.textContent = "";

    checkBtn.style.display = "block";

    nextBtn.style.display = "none";

    renderAnswer();

    renderWords(q.english);
}


/* =====================================================
   RENDER WORDS
   ===================================================== */

function renderWords(sentence){

    wordButtons.innerHTML = "";

    const words =
        sentence.trim().split(/\s+/);

    const shuffled =
        shuffle(
            words.map((word,index)=>({
                word:word,
                id:index
            }))
        );

    shuffled.forEach(item=>{

        const button =
            document.createElement("button");

        button.className = "word-btn";

        button.textContent =
            item.word;

        button.dataset.id =
            item.id;

        button.addEventListener(
            "click",
            function(){

                if(questionLocked) return;

                selectedWords.push(item);

                button.style.display =
                    "none";

                renderAnswer();
            }
        );

        wordButtons.appendChild(button);

    });
}


/* =====================================================
   RENDER ANSWER
   ===================================================== */

function renderAnswer(){

    answerBox.innerHTML = "";

    if(selectedWords.length === 0){

        const placeholder =
            document.createElement("div");

        placeholder.className =
            "answer-placeholder";

        placeholder.textContent =
            "கீழே உள்ள words-ஐ click செய்து sentence உருவாக்குங்கள்";

        answerBox.appendChild(
            placeholder
        );

        return;
    }

    selectedWords.forEach(
        (item,index)=>{

            const button =
                document.createElement("button");

            button.className =
                "answer-word";

            button.textContent =
                item.word;

            button.addEventListener(
                "click",
                function(){

                    if(questionLocked) return;

                    selectedWords.splice(
                        index,
                        1
                    );

                    restoreWord(item.id);

                    renderAnswer();

                }
            );

            answerBox.appendChild(
                button
            );

        }
    );
}

    const buttons =
        wordButtons.querySelectorAll(
            ".word-btn"
        );

    buttons.forEach(button=>{

        if(Number(button.dataset.id) === id){

            button.style.display =
                "inline-block";

        }

    });
}

    if(selectedWords.length === 0){

        result.textContent =
            "⚠️ முதலில் words-ஐ select செய்யுங்கள்.";

        result.style.color =
            "#dc2626";

        return;
    }

    const userAnswer =
        selectedWords
        .map(item=>item.word)
        .join(" ");

    const correctAnswer =
        q.english;


    /* CORRECT */

    if(userAnswer === correctAnswer){

        questionLocked = true;

        result.textContent =
            "✅ Correct!";

        result.style.color =
            "#16a34a";

        successSound();

        checkBtn.style.display =
            "none";

        nextBtn.style.display =
            "block";

        return;
    }


    /* WRONG */

    wrongAttempts++;

    wrongSound();


    /* FIRST WRONG */

    if(wrongAttempts === 1){

        result.textContent =
            "❌ Wrong! Try Again.";

        result.style.color =
            "#dc2626";

        selectedWords = [];

        renderAnswer();

        const buttons =
            wordButtons.querySelectorAll(
                ".word-btn"
            );

        buttons.forEach(button=>{

            button.style.display =
                "inline-block";

        });

        return;
    }


    /* SECOND WRONG */

    questionLocked = true;

    result.innerHTML =
        "❌ Wrong Again!<br>" +
        "Correct Answer: <strong>" +
        correctAnswer +
        "</strong>";

    result.style.color =
        "#dc2626";

    checkBtn.style.display =
        "none";

    nextBtn.style.display =
        "block";

});


/* =====================================================
   NEXT
   ===================================================== */

nextBtn.addEventListener(
"click",
function(){

    if(!questionLocked) return;

    currentIndex++;

    if(currentIndex >= questions.length){

        finishLevel();
        return;
    }

    loadQuestion();

    window.scrollTo({
        top:0,
        behavior:"smooth"
    });

});


/* =====================================================
   COMPLETE
   ===================================================== */

function finishLevel(){

    progressBar.style.width =
        "100%";

    currentCount.textContent =
        "50";

    gameCard.style.display =
        "none";

    completeCard.style.display =
        "block";
}


/* =====================================================
   START
   ===================================================== */

loadQuestion();

</script>

</body>
</html>
