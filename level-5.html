<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Level 5 - Basic English</title>

<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Tamil:wght@400;500;600;700;800&family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<style>

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    font-family:"Poppins","Noto Sans Tamil",sans-serif;
    background:linear-gradient(135deg,#eaf7ff,#d8f0ff);
    min-height:100vh;
    padding:10px;
    color:#172033;
}

.container{
    width:100%;
    max-width:850px;
    margin:auto;
}

.section{
    background:#fff;
    border-radius:24px;
    padding:25px;
    margin-bottom:18px;
    box-shadow:0 8px 30px rgba(0,100,180,.10);
}

/* TITLE */

.title{
    text-align:center;
    color:#087dcc;
    font-size:28px;
    font-weight:800;
}

.subtitle{
    text-align:center;
    color:#64748b;
    font-size:14px;
    margin-top:5px;
    margin-bottom:22px;
}

/* XP */

.xp-area{
    margin-bottom:22px;
}

.xp-top{
    display:flex;
    justify-content:space-between;
    font-size:14px;
    font-weight:700;
    margin-bottom:7px;
}

.xp{
    color:#087dcc;
}

.progress{
    width:100%;
    height:9px;
    background:#e5f3fb;
    border-radius:20px;
    overflow:hidden;
}

.progress-bar{
    height:100%;
    width:0%;
    background:#1597e5;
    border-radius:20px;
    transition:.4s;
}

/* WORD CARD */

.word-card{
    border:2px solid #e5f2f9;
    border-radius:18px;
    padding:16px;
    margin-bottom:12px;
    background:#fff;
}

.word-card.correct{
    background:#f0fdf4;
    border-color:#22c55e;
}

.word-row{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:15px;
}

.english-word{
    font-size:20px;
    font-weight:800;
    min-width:100px;
}

.meanings{
    display:flex;
    flex-wrap:wrap;
    justify-content:flex-end;
    gap:7px;
}

.meaning-btn{
    border:2px solid #cceafa;
    background:#f6fcff;
    color:#087dcc;
    border-radius:12px;
    padding:8px 12px;
    font-family:"Noto Sans Tamil","Poppins",sans-serif;
    font-size:13px;
    font-weight:600;
    cursor:pointer;
}

.meaning-btn:hover{
    background:#e7f7ff;
}

.meaning-btn.correct-btn{
    background:#dcfce7;
    border-color:#22c55e;
    color:#15803d;
}

.meaning-btn.wrong{
    background:#fee2e2;
    border-color:#ef4444;
    color:#dc2626;
}

/* BUTTONS */

.start-btn,
.check-btn,
.next-btn{
    width:100%;
    border:0;
    border-radius:14px;
    padding:14px;
    background:#087dcc;
    color:white;
    font-family:"Poppins",sans-serif;
    font-size:15px;
    font-weight:700;
    cursor:pointer;
}

.start-btn{
    margin-top:10px;
}

.start-btn:active,
.check-btn:active,
.next-btn:active{
    transform:scale(.98);
}

/* GAME */

#gameSection{
    display:none;
}

.question-number{
    text-align:center;
    color:#64748b;
    font-size:14px;
    font-weight:600;
}

.game-title{
    text-align:center;
    color:#087dcc;
    font-size:23px;
    font-weight:800;
    margin:8px 0;
}

.grammar-tag{
    display:block;
    width:max-content;
    max-width:100%;
    margin:0 auto 12px;
    background:#e7f6ff;
    color:#087dcc;
    border-radius:20px;
    padding:6px 13px;
    font-size:12px;
    font-weight:700;
    text-align:center;
}

.instruction{
    text-align:center;
    color:#64748b;
    font-size:13px;
    margin-bottom:15px;
}

.tamil-meaning{
    text-align:center;
    font-family:"Noto Sans Tamil";
    color:#475569;
    background:#f4fbff;
    border-radius:12px;
    padding:10px;
    margin-bottom:18px;
}

/* ANSWER */

.answer-box{
    min-height:65px;
    border:2px dashed #8dd0f4;
    border-radius:16px;
    padding:10px;
    display:flex;
    align-items:center;
    justify-content:center;
    flex-wrap:wrap;
    gap:8px;
    background:#fafdff;
    margin-bottom:18px;
}

.answer-placeholder{
    color:#94a3b8;
    text-align:center;
    font-size:13px;
}

.word-chip{
    border:0;
    background:#087dcc;
    color:#fff;
    padding:10px 14px;
    border-radius:11px;
    font-size:14px;
    font-weight:700;
    cursor:pointer;
}

/* WORD BANK */

.word-bank{
    display:flex;
    flex-wrap:wrap;
    justify-content:center;
    gap:8px;
    margin-bottom:18px;
}

.bank-word{
    border:2px solid #cceafa;
    background:#fff;
    color:#087dcc;
    padding:10px 14px;
    border-radius:12px;
    font-size:14px;
    font-weight:700;
    cursor:pointer;
}

.bank-word.used{
    opacity:.25;
    pointer-events:none;
}

/* FEEDBACK */

.feedback{
    text-align:center;
    min-height:27px;
    font-size:15px;
    font-weight:700;
}

.success{
    color:#16a34a;
}

.error{
    color:#dc2626;
}

/* COMPLETE */

#completeSection{
    display:none;
    text-align:center;
}

.complete-icon{
    font-size:65px;
}

.complete-title{
    color:#087dcc;
    font-size:28px;
    font-weight:800;
    margin:8px 0;
}

.complete-text{
    color:#64748b;
    font-size:14px;
    line-height:1.6;
}

.final-xp{
    display:inline-block;
    margin:20px 0;
    background:#e5f6ff;
    color:#087dcc;
    padding:12px 25px;
    border-radius:15px;
    font-size:20px;
    font-weight:800;
}

/* MOBILE */

@media(max-width:600px){

    body{
        padding:8px;
    }

    .section{
        padding:16px 12px;
        border-radius:20px;
    }

    .title{
        font-size:23px;
    }

    .subtitle{
        font-size:13px;
    }

    .word-card{
        padding:14px 12px;
    }

    .word-row{
        flex-direction:column;
        align-items:stretch;
        gap:10px;
    }

    .english-word{
        font-size:19px;
    }

    .meanings{
        justify-content:flex-start;
    }

    .meaning-btn{
        flex:1;
        min-width:0;
        font-size:12px;
        padding:9px 6px;
    }

    .game-title{
        font-size:21px;
    }

    .grammar-tag{
        font-size:11px;
    }

    .bank-word{
        padding:9px 11px;
        font-size:13px;
    }

    .word-chip{
        padding:9px 12px;
        font-size:13px;
    }
}

@media(max-width:360px){

    .meaning-btn{
        font-size:11px;
    }

    .bank-word{
        padding:8px 9px;
        font-size:12px;
    }
}

</style>
</head>

<body>

<div class="container">

<!-- =========================
     LEARN SECTION
========================= -->

<div class="section" id="learnSection">

    <div class="title">
        Level 5 🚀
    </div>

    <div class="subtitle">
        Present Continuous + Daily Actions
    </div>

    <div class="xp-area">

        <div class="xp-top">

            <span>Words Progress</span>

            <span class="xp" id="xpText">
                0 XP
            </span>

        </div>

        <div class="progress">

            <div
                class="progress-bar"
                id="progressBar">
            </div>

        </div>

    </div>

    <div id="wordsContainer"></div>

    <button
        class="start-btn"
        id="startGameBtn"
        style="display:none;">

        Start Grammar Game →

    </button>

</div>


<!-- =========================
     GAME SECTION
========================= -->

<div class="section" id="gameSection">

    <div
        class="question-number"
        id="questionNumber">

        Question 1 / 10

    </div>

    <div class="game-title">
        Sentence + Grammar 🧩
    </div>

    <div
        class="grammar-tag"
        id="grammarTag">

        Present Continuous

    </div>

    <div class="instruction">
        Click the words in the correct order
    </div>

    <div
        class="tamil-meaning"
        id="tamilMeaning">
    </div>

    <div
        class="answer-box"
        id="answerBox">

        <div class="answer-placeholder">
            Click the words below 👇
        </div>

    </div>

    <div
        class="word-bank"
        id="wordBank">
    </div>

    <div
        class="feedback"
        id="feedback">
    </div>

    <button
        class="check-btn"
        id="checkBtn">

        Check Answer ✓

    </button>

    <button
        class="next-btn"
        id="nextBtn">

        Next Question →

    </button>

</div>


<!-- =========================
     COMPLETE
========================= -->

<div
    class="section"
    id="completeSection">

    <div class="complete-icon">
        🎉
    </div>

    <div class="complete-title">
        Level 5 Complete!
    </div>

    <div class="complete-text">
        Excellent! You practiced
        Present Continuous and Questions.
    </div>

    <div
        class="final-xp"
        id="finalXP">

        100 XP

    </div>

    <button
        class="start-btn"
        onclick="location.reload()">

        Play Again 🔄

    </button>

</div>

</div>


<script>

/* =========================
   LEVEL 5 WORDS
========================= */

const learningWords = [

    {
        word:"Run",
        meaning:"ஓடு"
    },

    {
        word:"Walk",
        meaning:"நட"
    },

    {
        word:"Read",
        meaning:"படி"
    },

    {
        word:"Write",
        meaning:"எழுது"
    },

    {
        word:"Cook",
        meaning:"சமை"
    },

    {
        word:"Watch",
        meaning:"பார்"
    },

    {
        word:"Study",
        meaning:"படி / படிப்பு செய்"
    },

    {
        word:"Play",
        meaning:"விளையாடு"
    },

    {
        word:"Listen",
        meaning:"கேள்"
    },

    {
        word:"Talk",
        meaning:"பேசு"
    }

];


/* =========================
   GRAMMAR QUESTIONS
========================= */

const questions = [

    {
        answer:["I","am","running"],
        tamil:"நான் ஓடிக்கொண்டிருக்கிறேன்",
        grammar:"Present Continuous • Positive"
    },

    {
        answer:["She","is","reading"],
        tamil:"அவள் படித்துக்கொண்டிருக்கிறாள்",
        grammar:"Present Continuous • IS"
    },

    {
        answer:["They","are","playing"],
        tamil:"அவர்கள் விளையாடிக்கொண்டிருக்கிறார்கள்",
        grammar:"Present Continuous • ARE"
    },

    {
        answer:["We","are","walking"],
        tamil:"நாங்கள் நடந்துகொண்டிருக்கிறோம்",
        grammar:"Present Continuous • ARE"
    },

    {
        answer:["I","am","not","sleeping"],
        tamil:"நான் தூங்கிக்கொண்டிருக்கவில்லை",
        grammar:"Present Continuous • Negative"
    },

    {
        answer:["He","is","not","watching","TV"],
        tamil:"அவன் TV பார்த்துக்கொண்டிருக்கவில்லை",
        grammar:"Present Continuous • Negative"
    },

    {
        answer:["Are","you","studying"],
        tamil:"நீ படித்துக்கொண்டிருக்கிறாயா?",
        grammar:"Present Continuous • Question"
    },

    {
        answer:["Is","she","cooking"],
        tamil:"அவள் சமைத்துக்கொண்டிருக்கிறாளா?",
        grammar:"Present Continuous • Question"
    },

    {
        answer:["What","are","you","doing"],
        tamil:"நீ என்ன செய்துகொண்டிருக்கிறாய்?",
        grammar:"WH Question • ARE"
    },

    {
        answer:["They","are","talking","now"],
        tamil:"அவர்கள் இப்போது பேசிக்கொண்டிருக்கிறார்கள்",
        grammar:"Present Continuous • NOW"
    }

];


/* =========================
   VARIABLES
========================= */

let learnedWords = 0;

let xp = 0;

let currentQuestion = 0;

let selectedWords = [];

let mistakes = 0;


/* =========================
   BEEP
========================= */

function beep(type){

    const audioContext =
        new (
            window.AudioContext ||
            window.webkitAudioContext
        )();

    const oscillator =
        audioContext.createOscillator();

    const gain =
        audioContext.createGain();

    oscillator.connect(gain);

    gain.connect(
        audioContext.destination
    );

    oscillator.frequency.value =
        type === "good"
        ? 800
        : 250;

    gain.gain.setValueAtTime(
        0.15,
        audioContext.currentTime
    );

    gain.gain.exponentialRampToValueAtTime(
        0.001,
        audioContext.currentTime + 0.2
    );

    oscillator.start();

    oscillator.stop(
        audioContext.currentTime + 0.2
    );

}


/* =========================
   SHUFFLE
========================= */

function shuffle(array){

    return array.sort(
        () => Math.random() - 0.5
    );

}


/* =========================
   CREATE WORDS
========================= */

function createLearningWords(){

    const container =
        document.getElementById(
            "wordsContainer"
        );

    learningWords.forEach(
        (item,index)=>{

        const card =
            document.createElement("div");

        card.className =
            "word-card";

        card.id =
            "wordCard"+index;

        let wrongMeanings =
            learningWords
            .filter(
                x =>
                x.meaning !==
                item.meaning
            )
            .map(
                x => x.meaning
            );

        shuffle(wrongMeanings);

        let options = [

            item.meaning,
            wrongMeanings[0],
            wrongMeanings[1]

        ];

        shuffle(options);

        card.innerHTML = `

            <div class="word-row">

                <div class="english-word">
                    ${item.word}
                </div>

                <div class="meanings">

                    ${options.map(
                        option => `

                        <button
                            class="meaning-btn"
                            onclick="checkMeaning(
                                this,
                                '${item.meaning.replace(/'/g,"\\'")}',
                                ${index}
                            )">

                            ${option}

                        </button>

                    `).join("")}

                </div>

            </div>

        `;

        container.appendChild(card);

    });

}


/* =========================
   CHECK MEANING
========================= */

function checkMeaning(
    button,
    correct,
    index
){

    const card =
        document.getElementById(
            "wordCard"+index
        );

    if(
        card.classList.contains("correct")
    ){
        return;
    }

    if(
        button.innerText.trim() ===
        correct
    ){

        button.classList.add(
            "correct-btn"
        );

        card.classList.add(
            "correct"
        );

        card
        .querySelectorAll(
            ".meaning-btn"
        )
        .forEach(btn=>{
            btn.disabled=true;
        });

        learnedWords++;

        beep("good");

        updateProgress();

        if(
            learnedWords ===
            learningWords.length
        ){

            document.getElementById(
                "startGameBtn"
            ).style.display =
                "block";

        }

    }else{

        button.classList.add(
            "wrong"
        );

        beep("bad");

        setTimeout(()=>{
            button.classList.remove(
                "wrong"
            );
        },500);

    }

}


/* =========================
   PROGRESS
========================= */

function updateProgress(){

    const percentage =
        (
            learnedWords /
            learningWords.length
        ) * 100;

    document.getElementById(
        "progressBar"
    ).style.width =
        percentage+"%";

    document.getElementById(
        "xpText"
    ).innerText =
        xp+" XP";

}


/* =========================
   START GAME
========================= */

document
.getElementById("startGameBtn")
.addEventListener(
    "click",
    function(){

        document.getElementById(
            "learnSection"
        ).style.display =
            "none";

        document.getElementById(
            "gameSection"
        ).style.display =
            "block";

        loadQuestion();

    }
);


/* =========================
   LOAD QUESTION
========================= */

function loadQuestion(){

    selectedWords=[];

    mistakes=0;

    const question =
        questions[currentQuestion];

    document.getElementById(
        "questionNumber"
    ).innerText =
        "Question "+
        (currentQuestion+1)+
        " / "+
        questions.length;

    document.getElementById(
        "grammarTag"
    ).innerText =
        question.grammar;

    document.getElementById(
        "tamilMeaning"
    ).innerText =
        question.tamil;

    document.getElementById(
        "feedback"
    ).innerText="";

    document.getElementById(
        "feedback"
    ).className="feedback";

    document.getElementById(
        "checkBtn"
    ).style.display="block";

    document.getElementById(
        "nextBtn"
    ).style.display="none";

    renderAnswerBox();

    createWordBank();

}


/* =========================
   CREATE WORD BANK
========================= */

function createWordBank(){

    const bank =
        document.getElementById(
            "wordBank"
        );

    bank.innerHTML="";

    const correctWords =
        questions[currentQuestion].answer;

    let words=[
        ...correctWords
    ];

    const distractors=[

        "I",
        "You",
        "He",
        "She",
        "We",
        "They",

        "am",
        "is",
        "are",

        "not",

        "running",
        "walking",
        "reading",
        "writing",
        "cooking",
        "watching",
        "studying",
        "playing",
        "listening",
        "talking",

        "now",

        "what",
        "doing",

        "TV"

    ];

    const available =
        distractors.filter(
            word =>
            !words.includes(word)
        );

    shuffle(available);

    if(available[0]){
        words.push(
            available[0]
        );
    }

    if(available[1]){
        words.push(
            available[1]
        );
    }

    shuffle(words);

    words.forEach(
        (word,index)=>{

        const button =
            document.createElement(
                "button"
            );

        button.className =
            "bank-word";

        button.innerText =
            word;

        button.dataset.index =
            index;

        button.onclick =
            function(){

                selectWord(
                    word,
                    button
                );

            };

        bank.appendChild(button);

    });

}


/* =========================
   SELECT WORD
========================= */

function selectWord(
    word,
    button
){

    if(
        button.classList.contains(
            "used"
        )
    ){
        return;
    }

    selectedWords.push(word);

    button.classList.add(
        "used"
    );

    renderAnswerBox();

}


/* =========================
   ANSWER BOX
========================= */

function renderAnswerBox(){

    const box =
        document.getElementById(
            "answerBox"
        );

    if(
        selectedWords.length===0
    ){

        box.innerHTML=`

            <div class="answer-placeholder">
                Click the words below 👇
            </div>

        `;

        return;
    }

    box.innerHTML="";

    selectedWords.forEach(
        (word,index)=>{

        const chip =
            document.createElement(
                "button"
            );

        chip.className =
            "word-chip";

        chip.innerText =
            word;

        chip.onclick =
            function(){

                removeWord(index);

            };

        box.appendChild(chip);

    });

}


/* =========================
   REMOVE WORD
========================= */

function removeWord(index){

    selectedWords.splice(
        index,
        1
    );

    renderAnswerBox();

    updateBankButtons();

}


/* =========================
   UPDATE BANK
========================= */

function updateBankButtons(){

    const buttons =
        document.querySelectorAll(
            ".bank-word"
        );

    buttons.forEach(
        button=>{
            button.classList.remove(
                "used"
            );
        }
    );

    const used={};

    selectedWords.forEach(
        word=>{

        used[word]=
            (used[word] || 0)+1;

    });

    buttons.forEach(
        button=>{

        const word =
            button.innerText;

        if(used[word]>0){

            button.classList.add(
                "used"
            );

            used[word]--;

        }

    });

}


/* =========================
   CHECK ANSWER
========================= */

document
.getElementById("checkBtn")
.addEventListener(
    "click",
    checkAnswer
);


function checkAnswer(){

    const correct =
        questions[
            currentQuestion
        ].answer;

    const isCorrect =
        selectedWords.length ===
        correct.length &&
        selectedWords.every(
            (word,index)=>
                word ===
                correct[index]
        );

    const feedback =
        document.getElementById(
            "feedback"
        );

    if(isCorrect){

        beep("good");

        xp += 10;

        feedback.innerText =
            "Correct! 🎉 +10 XP";

        feedback.className =
            "feedback success";

        document.getElementById(
            "checkBtn"
        ).style.display =
            "none";

        document.getElementById(
            "nextBtn"
        ).style.display =
            "block";

        document.getElementById(
            "xpText"
        ).innerText =
            xp+" XP";

    }else{

        mistakes++;

        beep("bad");

        feedback.innerText =
            "Not quite! Try again ❌";

        feedback.className =
            "feedback error";

        if(mistakes>=3){

            showCorrectAnswer();

        }

    }

}


/* =========================
   SHOW ANSWER
========================= */

function showCorrectAnswer(){

    selectedWords=[
        ...questions[
            currentQuestion
        ].answer
    ];

    renderAnswerBox();

    document.getElementById(
        "feedback"
    ).innerText =
        "Correct answer 👇";

    document.getElementById(
        "feedback"
    ).className =
        "feedback success";

    document.getElementById(
        "checkBtn"
    ).style.display =
        "none";

    document.getElementById(
        "nextBtn"
    ).style.display =
        "block";

}


/* =========================
   NEXT
========================= */

document
.getElementById("nextBtn")
.addEventListener(
    "click",
    function(){

        currentQuestion++;

        if(
            currentQuestion >=
            questions.length
        ){

            finishLevel();

        }else{

            loadQuestion();

        }

    }
);


/* =========================
   FINISH
========================= */

function finishLevel(){

    document.getElementById(
        "gameSection"
    ).style.display =
        "none";

    document.getElementById(
        "completeSection"
    ).style.display =
        "block";

    document.getElementById(
        "finalXP"
    ).innerText =
        xp+" XP";

}


/* =========================
   START
========================= */

createLearningWords();

updateProgress();

</script>
