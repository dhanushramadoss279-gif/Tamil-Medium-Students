/* =====================================================
   SHUFFLE
   ===================================================== */

function shuffle(array){

    for(let i=array.length-1;i>0;i--){

        const j=Math.floor(
            Math.random()*(i+1)
        );

        [array[i],array[j]]=
        [array[j],array[i]];

    }

    return array;
}


/* =====================================================
   SUCCESS SOUND
   ===================================================== */

function successSound(){

    const AC=
        window.AudioContext ||
        window.webkitAudioContext;

    if(!AC) return;

    const audio=new AC();

    const osc=audio.createOscillator();

    const gain=audio.createGain();

    osc.frequency.value=700;

    gain.gain.setValueAtTime(
        .12,
        audio.currentTime
    );

    gain.gain.exponentialRampToValueAtTime(
        .001,
        audio.currentTime+.3
    );

    osc.connect(gain);

    gain.connect(audio.destination);

    osc.start();

    osc.stop(
        audio.currentTime+.3
    );
}


/* =====================================================
   WRONG SOUND
   ===================================================== */

function wrongSound(){

    const AC=
        window.AudioContext ||
        window.webkitAudioContext;

    if(!AC) return;

    const audio=new AC();

    const osc=audio.createOscillator();

    const gain=audio.createGain();

    osc.type="square";

    osc.frequency.value=180;

    gain.gain.setValueAtTime(
        .15,
        audio.currentTime
    );

    gain.gain.exponentialRampToValueAtTime(
        .001,
        audio.currentTime+.2
    );

    osc.connect(gain);

    gain.connect(audio.destination);

    osc.start();

    osc.stop(
        audio.currentTime+.2
    );
}

    progress.style.width=

        q.mode==="sentence"
        ? "Sentence Game"
        : q.mode==="blank"
        ? "Fill in the Blank"
        : "Speaking Practice";

    typeBadge.textContent=q.type;

    tamil.textContent=q.tamil;

    selectedBlank="";

    transcript="";

    wrongAttempts=0;

    locked=false;

    result.textContent="";

    check.style.display="block";

    next.style.display="none";

    renderMode(q);
}

                (word,index)=>({
                    word:word,
                    id:index
                })
            )
        );

    shuffled.forEach(item=>{

        const button=
            document.createElement("button");

        button.className="word-btn";

        button.textContent=item.word;

        button.dataset.id=item.id;

        button.onclick=()=>{

            if(locked) return;

            selectedWords.push(item);

            button.style.display="none";

            renderAnswer();

        };

        wordsBox.appendChild(button);

    });

}


/* =====================================================
   ANSWER
   ===================================================== */

function renderAnswer(){

    const box=
        document.getElementById("answerBox");

    if(!box) return;

    box.innerHTML="";

    if(selectedWords.length===0){

        const p=
            document.createElement("div");

        p.className="placeholder";

        p.textContent=
            "Words-ஐ click செய்து sentence உருவாக்குங்கள்";

        box.appendChild(p);

        return;
    }

    selectedWords.forEach(
        (item,index)=>{

            const button=
                document.createElement("button");

            button.className="answer-word";

            button.textContent=item.word;

            button.onclick=()=>{

                if(locked) return;

                selectedWords.splice(index,1);

                restoreWord(item.id);

                renderAnswer();

            };

            box.appendChild(button);

        }
    );
}


/* =====================================================
   RESTORE
   ===================================================== */

function restoreWord(id){

    const buttons=
        document.querySelectorAll(
            "#words .word-btn"
        );

    buttons.forEach(button=>{

        if(Number(button.dataset.id)===id){

            button.style.display=
                "inline-block";

        }

    });

}


/* =====================================================
   FILL BLANK
   ===================================================== */

function renderBlank(q){

    const sentence=
        document.createElement("div");

    sentence.className="blank-sentence";

    sentence.textContent=q.english;

    content.appendChild(sentence);

    const options=
        document.createElement("div");

    options.className="blank-options";

    const shuffled=
        shuffle([...q.options]);

    shuffled.forEach(option=>{

        const button=
            document.createElement("button");

        button.className="blank-option";

        button.textContent=option;

        button.onclick=()=>{

            if(locked) return;

            selectedBlank=option;

            document
                .querySelectorAll(".blank-option")
                .forEach(btn=>{
                    btn.classList.remove("selected");
                });

            button.classList.add("selected");

        };

        options.appendChild(button);

    });

    content.appendChild(options);

}


/* =====================================================
   SPEAK
   ===================================================== */

function renderSpeak(q){

    const box=
        document.createElement("div");

    box.className="speak-box";

    box.innerHTML=`

        <div style="font-size:14px;color:#64748b;">
            இந்த sentence-ஐ English-ல் பேசுங்கள்
        </div>

        <button class="mic-btn" id="mic">
            🎤
        </button>

        <div class="transcript" id="transcript">
            Speak button-ஐ press செய்யுங்கள்
        </div>

    `;

    content.appendChild(box);

    const mic=
        document.getElementById("mic");

    const transcriptBox=
        document.getElementById("transcript");

    const SpeechRecognition=
        window.SpeechRecognition ||
        window.webkitSpeechRecognition;

    if(!SpeechRecognition){

        transcriptBox.textContent=
            "இந்த browser-ல் voice recognition support இல்லை.";

        mic.disabled=true;

        return;
    }

    const recognition=
        new SpeechRecognition();

    recognition.lang="en-US";

    recognition.interimResults=false;

    recognition.continuous=false;

    mic.onclick=()=>{

        if(locked) return;

        transcriptBox.textContent=
            "🎤 Listening...";

        mic.classList.add("listening");

        recognition.start();

    };

    recognition.onresult=(event)=>{

        transcript=
            event.results[0][0].transcript.trim();

        transcriptBox.textContent=
            transcript;

        mic.classList.remove("listening");

    };

    recognition.onerror=()=>{

        mic.classList.remove("listening");

        transcriptBox.textContent=
            "Voice கேட்கவில்லை. மீண்டும் try செய்யுங்கள்.";

    };

    recognition.onend=()=>{

        mic.classList.remove("listening");

    };

}


/* =====================================================
   NORMALIZE
   ===================================================== */

function normalize(text){

    return text
        .toLowerCase()
        .replace(/[?.!,]/g,"")
        .replace(/\s+/g," ")
        .trim();

}


/* =====================================================
   CHECK
   ===================================================== */

check.onclick=()=>{

    if(locked) return;

    const q=questions[currentIndex];

    let correct=false;

    /* SENTENCE */

    if(q.mode==="sentence"){

        const user=
            selectedWords
            .map(item=>item.word)
            .join(" ");

        correct=
            normalize(user) ===
            normalize(q.english);

    }

    /* BLANK */

    else if(q.mode==="blank"){

        if(!selectedBlank){

            result.textContent=
                "⚠️ முதலில் answer select செய்யுங்கள்.";

            result.style.color="#dc2626";

            return;
        }

        correct=
            normalize(selectedBlank) ===
            normalize(q.answer);

    }

    /* SPEAK */

    else{

        if(!transcript){

            result.textContent=
                "⚠️ முதலில் sentence-ஐ பேசுங்கள்.";

            result.style.color="#dc2626";

            return;
        }

        correct=
            normalize(transcript) ===
            normalize(q.english);

    }


    /* CORRECT */

    if(correct){

        locked=true;

        successSound();

        result.textContent=
            "✅ Correct!";

        result.style.color="#16a34a";

        check.style.display="none";

        next.style.display="block";

        return;

    }


    /* WRONG */

    wrongAttempts++;

    wrongSound();


    if(wrongAttempts===1){

        result.textContent=
            "❌ Wrong! Try Again.";

        result.style.color="#dc2626";

        resetCurrentAnswer();

        return;

    }


    /* SECOND WRONG */

    locked=true;

    result.innerHTML=
        "❌ Wrong Again!<br>" +
        "Correct Answer: <strong>" +
        q.english +
        "</strong>";

    result.style.color="#dc2626";

    check.style.display="none";

    next.style.display="block";

};


/* =====================================================
   RESET AFTER FIRST WRONG
   ===================================================== */

function resetCurrentAnswer(){

    const q=questions[currentIndex];

    if(q.mode==="sentence"){

        selectedWords=[];

        renderAnswer();

        document
            .querySelectorAll("#words .word-btn")
            .forEach(button=>{
                button.style.display="inline-block";
            });

    }

    else if(q.mode==="blank"){

        selectedBlank="";

        document
            .querySelectorAll(".blank-option")
            .forEach(button=>{
                button.classList.remove("selected");
            });

    }

    else{

        transcript="";

        const box=
            document.getElementById("transcript");

        if(box){

            box.textContent=
                "மீண்டும் பேசுங்கள் 🎤";

        }

    }

}


/* =====================================================
   NEXT
   ===================================================== */

next.onclick=()=>{

    if(!locked) return;

    currentIndex++;

    if(currentIndex>=questions.length){

        finish();

        return;
    }

    loadQuestion();

    window.scrollTo({
        top:0,
        behavior:"smooth"
    });

};


/* =====================================================
   FINISH
   ===================================================== */

function finish(){

    progress.style.width="100%";

    count.textContent="50";

    game.style.display="none";

    complete.style.display="block";

}


/* =====================================================
   START
   ===================================================== */

loadQuestion();

</script>

</html>
